name: container

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "requirements.lock"
      - "common/**"
      - "tools/**"
      - "scripts/**"
      - "wake_robin_data_pipeline/**"
      - "tests/**"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "requirements.lock"

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deliberately NOT ghcr.io/${{ github.repository }}. Docker requires repository names
  # to be lowercase, and github.repository preserves the owner's case — under the
  # WR-SW-Dev org that yields "ghcr.io/WR-SW-Dev/biotech-screener", which docker build
  # rejects outright ("repository name must be lowercase"). Actions expressions have no
  # lower() function, so each job resolves the real value into $GITHUB_ENV via bash
  # case conversion. This value is only the fallback for anything that reads it before
  # that step runs.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:test .

      - name: Run tests in container
        run: |
          docker run --rm \
            -e PYTHONHASHSEED=0 \
            ${{ env.IMAGE_NAME }}:test \
            -m pytest tests/ -q \
              --override-ini="addopts=" \
              -m "not slow" \
              --ignore=tests/integration

      - name: Verify JSON logging works
        run: |
          docker run --rm \
            -e LOG_FORMAT=json \
            ${{ env.IMAGE_NAME }}:test \
            -c "from common.logging_config import setup_structured_logging; setup_structured_logging(); import logging; logging.info('container-ok')" \
          | python -c "import sys, json; d=json.load(sys.stdin); assert d['message']=='container-ok'"

      - name: Smoke test — import pipeline and verify entry points
        run: |
          docker run --rm \
            -e PYTHONHASHSEED=0 \
            ${{ env.IMAGE_NAME }}:test \
            -c "
          # Verify all critical imports resolve inside the container
          from run_screen import run_screening_pipeline
          from decision_engine import DecisionRuleset, compute_decision_fields, DEFAULT_RULESET
          from tools.run_daily_production import GATE_ALLOWLIST, MANIFEST_VERSION
          from archive_snapshot import sha256_file
          from backtest.ic_measurement import calculate_ic
          from common.clinical_calendar_alpha import compute_calendar_alpha
          from common.staleness_gates import check_staleness
          from common.data_quality import DataQualityGates
          from common.pit_enforcement import PITViolationError

          # Verify decision engine produces deterministic output
          import json, hashlib
          rs = DEFAULT_RULESET
          assert rs.ruleset_id, 'DEFAULT_RULESET has no ruleset_id'
          assert len(GATE_ALLOWLIST) >= 20, f'GATE_ALLOWLIST too small: {len(GATE_ALLOWLIST)}'

          print(f'OK: ruleset={rs.ruleset_id}, gates={len(GATE_ALLOWLIST)}, manifest={MANIFEST_VERSION}')
          "

      - name: Smoke test — mypy passes in container
        run: |
          docker run --rm \
            ${{ env.IMAGE_NAME }}:test \
            -m mypy decision_engine.py common/

  push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker build \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:$SHORT_SHA \
            .

      - name: Push to GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker push ${{ env.IMAGE_NAME }}:$SHORT_SHA
