name: container

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "common/**"
      - "tools/**"
      - "scripts/**"
      - "wake_robin_data_pipeline/**"
      - "tests/**"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:test .

      - name: Run tests in container
        run: |
          docker run --rm \
            -e PYTHONHASHSEED=0 \
            ${{ env.IMAGE_NAME }}:test \
            -m pytest tests/ -q \
              --ignore=tests/integration \
              --ignore=tests/test_minimum_suite.py \
              --ignore=tests/test_golden_baseline.py \
              --ignore=tests/test_run_screen.py \
              --ignore=tests/test_module_5_defensive.py

      - name: Verify JSON logging works
        run: |
          docker run --rm \
            -e LOG_FORMAT=json \
            ${{ env.IMAGE_NAME }}:test \
            -c "from common.logging_config import setup_structured_logging; setup_structured_logging(); import logging; logging.info('container-ok')" \
          | python -c "import sys, json; d=json.load(sys.stdin); assert d['message']=='container-ok'"

  push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker build \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:$SHORT_SHA \
            .

      - name: Push to GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker push ${{ env.IMAGE_NAME }}:$SHORT_SHA
