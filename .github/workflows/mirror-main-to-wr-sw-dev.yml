name: mirror-main-to-wr-sw-dev

# Keeps WR-SW-Dev/biotech-screener's `main` in step with this repository's
# `main`. `origin` (Warrenpoobear) is primary.
#
# This opens a pull request rather than pushing to `main`. WR-SW-Dev/main is a
# protected branch (classic branch protection, added 2026-08-08 or -09), so a
# direct push is declined:
#
#     ! [remote rejected] origin/main -> main (protected branch hook declined)
#
# Pushing a *branch* there is still permitted, so the mirror pushes a branch and
# proposes it. The protection stays intact and a human merges — which is the
# point of protecting the branch. Nothing here tries to route around it.
#
# Safety: never force-pushes, never pushes to `main`. Before proposing anything
# it checks whether the mirror carries content this repository lacks; if so it
# fails loudly rather than opening a PR that would revert someone's work.
#
# Setup (one time): repository secret WRSWDEV_MIRROR_TOKEN — a fine-grained PAT
# scoped to WR-SW-Dev/biotech-screener with:
#   - Contents: read and write        (push the mirror branch)
#   - Pull requests: read and write   (open / update the PR)
# The token's own access is enough for both; it does not need, and must not be
# given, any bypass of the branch protection.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-main-to-wr-sw-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  MIRROR_REPO: WR-SW-Dev/biotech-screener
  MIRROR_BRANCH: mirror/main-sync

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      # An unconfigured mirror is a deferred decision, not a failure. Failing
      # here put a red X on every merge to main — 16 consecutive failed runs,
      # all the same missing secret — and a check that is always red teaches
      # everyone to ignore red. Skip cleanly instead: the workflow stays armed
      # and starts working the moment the secret exists.
      - name: Check for mirror credential
        id: credential
        env:
          MIRROR_TOKEN: ${{ secrets.WRSWDEV_MIRROR_TOKEN }}
        run: |
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "::notice::WRSWDEV_MIRROR_TOKEN is not set — skipping mirror sync. To enable, add a fine-grained PAT on ${MIRROR_REPO} with 'Contents: read and write' and 'Pull requests: read and write'. Until then the mirror is synced by hand; see CLAUDE.md."
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@v4
        if: steps.credential.outputs.configured == 'true'
        with:
          fetch-depth: 0

      - name: Compare against the mirror
        id: compare
        if: steps.credential.outputs.configured == 'true'
        env:
          MIRROR_TOKEN: ${{ secrets.WRSWDEV_MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          git remote add mirror \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git"
          git fetch --quiet mirror main

          ours=$(git rev-parse HEAD)
          theirs=$(git rev-parse mirror/main)

          # Content parity, not commit identity. Merging a PR on the mirror
          # creates a merge commit that this repository will never have, so the
          # two branches legitimately differ in history while holding identical
          # trees. Comparing trees is what actually answers "is the mirror
          # current?".
          if [ "$(git rev-parse "${ours}^{tree}")" = "$(git rev-parse "${theirs}^{tree}")" ]; then
            echo "Mirror content is identical to ${ours:0:8}. Nothing to propose."
            echo "action=none" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Would a sync discard work that exists only on the mirror? Three-dot
          # diff = changes made on the mirror side since the branches parted.
          # Expected to be empty: the mirror is downstream, not a fork.
          if ! git diff --quiet "${ours}...${theirs}"; then
            echo "::error::${MIRROR_REPO} carries changes this repository does not have — refusing to propose a sync that would revert them."
            git diff --stat "${ours}...${theirs}" | tail -20
            exit 1
          fi

          echo "Mirror is behind by $(git rev-list --count "${theirs}..${ours}") commit(s)."
          echo "action=propose" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${ours}" >> "${GITHUB_OUTPUT}"

      - name: Push the mirror branch
        if: steps.credential.outputs.configured == 'true' && steps.compare.outputs.action == 'propose'
        env:
          MIRROR_TOKEN: ${{ secrets.WRSWDEV_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          # Plain push to a NON-protected branch. Not a force push: this branch
          # only ever tracks origin/main, which moves forward. If it is ever
          # rejected as non-fast-forward, something rewrote history and a human
          # should look rather than have the mirror overwrite it.
          git push mirror "HEAD:refs/heads/${MIRROR_BRANCH}"

      - name: Open or update the pull request
        if: steps.credential.outputs.configured == 'true' && steps.compare.outputs.action == 'propose'
        env:
          GH_TOKEN: ${{ secrets.WRSWDEV_MIRROR_TOKEN }}
          HEAD_SHA: ${{ steps.compare.outputs.head_sha }}
        run: |
          set -euo pipefail

          existing=$(gh pr list --repo "${MIRROR_REPO}" --head "${MIRROR_BRANCH}" \
                       --state open --json url --jq '.[0].url // ""')

          if [ -n "${existing}" ]; then
            # The branch push above already moved the PR's head; no second PR.
            echo "Updated existing PR: ${existing}"
            echo "PR=${existing}" >> "${GITHUB_ENV}"
            exit 0
          fi

          cat > "${RUNNER_TEMP}/mirror-pr-body.md" <<EOF
          Automated mirror sync from \`Warrenpoobear/biotech-screener@${HEAD_SHA}\`.

          \`origin\` (Warrenpoobear) is the primary remote; this branch carries its
          \`main\` verbatim. No commits originate here, so this diff should only
          ever be work already reviewed upstream.

          Opened as a pull request rather than pushed directly because \`main\` is
          protected on this repository. Merging is a human decision by design.

          Raised by \`.github/workflows/mirror-main-to-wr-sw-dev.yml\`.
          EOF

          url=$(gh pr create --repo "${MIRROR_REPO}" \
                  --base main --head "${MIRROR_BRANCH}" \
                  --title "mirror: sync main from Warrenpoobear/biotech-screener" \
                  --body-file "${RUNNER_TEMP}/mirror-pr-body.md")
          echo "Opened PR: ${url}"
          echo "PR=${url}" >> "${GITHUB_ENV}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Mirror to ${MIRROR_REPO}"
            echo ""
            echo "- Source: \`${GITHUB_REPOSITORY}@${GITHUB_SHA:0:8}\`"
            if [ "${{ steps.credential.outputs.configured }}" != "true" ]; then
              echo "- Action: \`skipped — WRSWDEV_MIRROR_TOKEN not configured\`"
            else
              echo "- Action: \`${{ steps.compare.outputs.action || 'failed' }}\`"
            fi
            if [ -n "${PR:-}" ]; then echo "- Pull request: ${PR}"; fi
            echo "- Result: \`${{ job.status }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
