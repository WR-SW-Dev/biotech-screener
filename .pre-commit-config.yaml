repos:
  - repo: https://github.com/psf/black
    rev: "26.5.1"
    hooks:
      - id: black
        args: [--line-length=120, --target-version=py310]

  - repo: https://github.com/pycqa/isort
    rev: "5.13.2"
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/pycqa/flake8
    rev: "7.3.0"
    hooks:
      - id: flake8
        # Enforce only on maintained pipeline code; legacy utility scripts at
        # root are excluded — they predate this CI setup and are not production paths.
        files: >-
          (?x)^(
            common/.*\.py|
            tools/.*\.py|
            scripts/.*\.py|
            agents/.*\.py|
            tests/.*\.py|
            decision_engine\.py|
            run_screen\.py|
            run_screen_columns\.py|
            module_\d+.*\.py|
            module_5_composite.*\.py|
            module_5_scoring.*\.py|
            module_5_diagnostics.*\.py|
            selector_engine\.py|
            ranker_engine\.py|
            ranker_v2_pairwise\.py|
            catalyst_diagnostics\.py|
            catalyst_summary\.py|
            morningstar_signal_engine\.py|
            pit_enforcement\.py|
            pit_financials\.py|
            run_phase2.*\.py|
            run_production_screen\.py
          )$
        args:
          - --max-line-length=120
          - --extend-ignore=E501,W503,E203,E266,E402

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        exclude: |
          (?x)^(
            \.env|
            data/.*|
            cache/.*|
            production_data/.*|
            output/.*|
            .*\.csv|
            .*\.tar\.gz
          )$
